<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="field" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#1C1814"/>
      <stop offset="100%" stop-color="#0F0D0B"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="106" y1="106" x2="406" y2="406">
      <stop offset="0%" stop-color="#D4AF6A"/>
      <stop offset="52%" stop-color="#C7CBD1"/>
      <stop offset="100%" stop-color="#D4AF6A"/>
    </linearGradient>
    <linearGradient id="core" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#F0DCB4"/>
      <stop offset="100%" stop-color="#D4AF6A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#field)"/>

  <!-- aperture blades -->
  <g fill="none" stroke="url(#ring)" stroke-width="15" stroke-linecap="round" opacity=".92">
    <circle cx="256" cy="256" r="150"/>
  </g>
  <g stroke="url(#ring)" stroke-width="13" stroke-linecap="round" opacity=".58">
    <line x1="256" y1="106" x2="256" y2="166"/>
    <line x1="256" y1="346" x2="256" y2="406"/>
    <line x1="106" y1="256" x2="166" y2="256"/>
    <line x1="346" y1="256" x2="406" y2="256"/>
    <line x1="150" y1="150" x2="192" y2="192"/>
    <line x1="320" y1="320" x2="362" y2="362"/>
    <line x1="362" y1="150" x2="320" y2="192"/>
    <line x1="192" y1="320" x2="150" y2="362"/>
  </g>

  <!-- core -->
  <circle cx="256" cy="256" r="74" fill="url(#core)"/>
  <circle cx="256" cy="256" r="74" fill="none" stroke="#0F0D0B" stroke-width="7" opacity=".28"/>
  <ellipse cx="234" cy="228" rx="26" ry="18" fill="#FFF8E8" opacity=".45" transform="rotate(-28 234 228)"/>
</svg>
