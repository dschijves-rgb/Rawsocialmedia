<style>
  :root{
    --bg:#0F0D0B;
    --text:#EDEAE4;
    --text-soft:#9C978D;
    --muted:#726E66;
    --gold:#D4AF6A;
    --gold-rgb:212,175,106;
    --silver:#C7CBD1;
    --silver-rgb:199,203,209;
    --danger:#C1554B;
    --danger-rgb:193,85,75;
    --tint-rgb:255,255,255;
    --surface: rgba(255,255,255,0.045);
    --blur: blur(16px);
    --weight-body: 400;
    --weight-medium: 500;
    --weight-bold: 700;
  }
  body.daylight{
    --bg:#F6F5F2;
    --text:#15130F;
    --text-soft:#4B473F;
    --muted:#6B675F;
    --gold:#8A6423;
    --gold-rgb:138,100,35;
    --silver:#5B5F66;
    --silver-rgb:91,95,102;
    --danger:#A23F35;
    --danger-rgb:162,63,53;
    --tint-rgb:0,0,0;
    --surface: rgba(246,245,242,0.94);
    --blur: none;
    --weight-body: 600;
    --weight-medium: 700;
    --weight-bold: 800;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    font-weight:var(--weight-body);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  .hero-gradient{
    background:linear-gradient(135deg, var(--gold), var(--silver));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .daylight-toggle-btn{
    position:fixed;top:16px;right:16px;z-index:20;
    width:42px;height:42px;border-radius:50%;
    background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid rgba(var(--tint-rgb),0.15);
    color:var(--gold);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  #app{max-width:640px;margin:0 auto;padding:76px 20px 60px;}
  .loading{color:var(--text-soft);font-size:14px;padding-top:40px;text-align:center;}

  .head h1{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    font-size:26px;
    font-weight:var(--weight-bold);
    margin:0 0 16px;
  }
  .head .sub{margin:0 0 14px;color:var(--text-soft);font-size:14px;}
  .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 26px;}
  .action-btn{
    background:transparent;border:1px solid var(--text);color:var(--text);
    padding:7px 12px;font-size:12px;font-family:inherit;border-radius:2px;
    cursor:pointer;white-space:nowrap;
  }
  .action-btn:hover{background:var(--text);color:var(--bg);}
  .back-btn{margin-bottom:12px;}
  .ios-hint{font-size:12px;color:var(--text-soft);}

  .cycle{
    display:flex;align-items:center;gap:16px;padding:20px 18px;
    background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid rgba(var(--gold-rgb),0.35);border-radius:14px;
    margin-bottom:36px;
  }
  .cycle-num{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:40px;font-weight:700;
    color:var(--gold);min-width:52px;text-align:center;
  }
  .cycle.due .cycle-num{color:var(--danger);}
  .cycle-text{flex:1;}
  .cycle-label{font-size:14px;font-weight:var(--weight-bold);}
  .cycle-sub{font-size:13px;color:var(--text-soft);margin-top:2px;}

  /* Month grid view */
  .month-nav{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:22px;
    border-bottom:1px solid rgba(var(--tint-rgb),0.12);
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .month-nav::-webkit-scrollbar{display:none;}
  .month-nav-link{
    flex:0 0 auto;font-size:12px;color:var(--text-soft);text-decoration:none;
    padding:5px 10px;border:1px solid rgba(var(--tint-rgb),0.25);border-radius:12px;
    white-space:nowrap;
  }
  .nav-today-btn{
    flex:0 0 auto;font-size:12px;font-family:inherit;font-weight:600;
    color:var(--bg);background:var(--gold);border:1px solid var(--gold);
    padding:5px 12px;border-radius:12px;white-space:nowrap;cursor:pointer;
  }
  .month-block{margin-bottom:32px;}
  .month-title{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:18px;font-weight:var(--weight-bold);margin:0 0 10px;}
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;}
  .weekday-row span{font-size:11px;color:var(--muted);text-align:center;}
  .week-row{
    display:grid;grid-template-columns:repeat(7,1fr);
    cursor:pointer;border-radius:6px;padding:3px 0;
  }
  .week-row:active{background:rgba(var(--tint-rgb),0.08);}
  .day-cell{
    display:flex;align-items:center;justify-content:center;
    height:36px;position:relative;
  }
  .day-num{font-size:13px;color:var(--text);position:relative;z-index:1;}
  .day-cell.out .day-num{color:var(--muted);opacity:.4;}
  .day-cell.today::before{
    content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:26px;height:26px;border-radius:50%;background:var(--gold);
  }
  .day-cell.today .day-num{color:var(--bg);font-weight:600;}
  .idea-dot{
    position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--danger);z-index:2;
  }

  /* Week detail view */
  .week{display:flex;flex-direction:column;}
  .row{display:flex;gap:14px;position:relative;}
  .marker{width:16px;position:relative;display:flex;justify-content:center;flex-shrink:0;}
  .marker::before{
    content:'';position:absolute;top:0;bottom:-22px;width:1px;
    background:var(--text-soft);opacity:.35;left:50%;
  }
  .row:first-child .marker::before{top:8px;}
  .row:last-child .marker::before{display:none;}
  .dot{
    width:9px;height:9px;border-radius:50%;background:var(--bg);
    border:1.5px solid var(--text-soft);margin-top:6px;position:relative;z-index:1;
  }
  .row.today .dot{background:var(--gold);border-color:var(--gold);}

  .content{flex:1;padding-bottom:20px;border-bottom:1px solid rgba(var(--tint-rgb),0.1);margin-bottom:10px;}
  .row:last-child .content{border-bottom:none;margin-bottom:0;}
  .row-top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .row-top-link{cursor:pointer;}
  .row-top-link .day-label{text-decoration:underline;text-decoration-color:rgba(var(--tint-rgb),0.25);text-underline-offset:3px;}
  .day-label{font-weight:var(--weight-bold);font-size:14px;}
  .day-date{font-size:12px;color:var(--muted);}
  .today-flag{
    font-size:11px;color:var(--gold);border:1px solid var(--gold);
    padding:1px 6px;border-radius:2px;margin-left:auto;
  }
  .day-detail{display:flex;flex-direction:column;}
  .day-detail .task-input{font-size:20px;margin-bottom:6px;}
  .day-detail .detail-input{font-size:14px;margin-bottom:14px;}
  .day-detail .done-toggle{margin-bottom:16px;font-size:14px;}
  .day-note-textarea{
    width:100%;min-height:140px;resize:none;border:1px solid rgba(var(--tint-rgb),0.2);border-radius:6px;

  .hamburger-btn{

</style>

<body>
<div id="app"><p class="loading">Loading your plan…</p></div>

<button id="notesHamburger" class="hamburger-btn" aria-label="Notes menu">☰<span id="notesDot" class="notes-dot" hidden></span></button>
<button id="daylightToggle" class="daylight-toggle-btn" aria-label="Toggle daylight mode">☀</button>
<div id="notesBackdrop" class="notes-backdrop" hidden></div>
<div id="notesDrawer" class="notes-drawer" hidden>
  <div id="notesListView">
    <h3 class="drawer-title">Menu</h3>
    <div class="drawer-section-label">People</div>
    <button class="drawer-person-row" data-idx="0">Danny</button>

    <button class="drawer-nav-row" id="openStageFilmed">Filmed</button>
    <button class="drawer-nav-row" id="openStageEdited">Edited</button>
    <button class="drawer-nav-row" id="openStagePosted">Posted</button>
    <button class="drawer-nav-row" id="openIdeasBank">Ideas bank</button>
  </div>

  <div id="notesPersonView" hidden>
    <button class="drawer-back-btn" data-back="list">← Back</button>
    <h3 class="drawer-title" id="notesPersonTitle"></h3>
    <textarea class="person-notes-textarea" id="personNotesArea" placeholder="Jot anything down for yourself..."></textarea>
  </div>

  <div id="stageCreateView" hidden>
    <button class="drawer-back-btn" data-back="list">← Back</button>
    <h3 class="drawer-title">Video idea</h3>
    <input type="text" id="newIdeaText" class="drawer-input" placeholder="What's the idea?">
    <input type="date" id="newIdeaDate" class="drawer-input">
    <select id="newIdeaAssignee" class="drawer-input">
      <option value="">Unassigned</option>
      <option value="Danny">Danny</option>
      <option value="Shauli">Shauli</option>
      <option value="Sruli">Sruli</option>
    </select>
    <p id="duplicateWarning" class="duplicate-warning" hidden></p>
    <button id="addIdeaBtn" class="action-btn">Add to calendar</button>
  </div>

  <div id="stageListView" hidden>
    <button class="drawer-back-btn" data-back="list">← Back</button>
    <h3 class="drawer-title" id="stageListTitle"></h3>
    <div id="stageListItems"></div>
  </div>

  <div id="ideasBankView" hidden>
    <button class="drawer-back-btn" data-back="list">← Back</button>
    <h3 class="drawer-title">Ideas bank</h3>
    <input type="text" id="bankInput" class="drawer-input" placeholder="Add an idea...">
    <button id="bankAddBtn" class="action-btn">Add</button>
    <div id="bankListItems"></div>
  </div>
</div>

<script>
(async function(){
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const WEEKDAY_LABELS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const WEEKDAY_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Motzei Shabbos'];
  const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function fmtISO(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function fmtShort(d){ return `${MONTH_SHORT[d.getMonth()]} ${d.getDate()}`; }
  function fmtLong(d){ return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
  function escapeAttr(s){
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }
  const SUPABASE_URL = 'https://djtnfvosvkddcifzidnw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdG5mdm9zdmtkZGNpZnppZG53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTA3NTUsImV4cCI6MjEwNDQyNjc1NX0.LzsZRSee7pq87ngbLccVz81GVu-er0QREO8I0ckRVIA';
  const SB_HEADERS = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

  async function safeGet(key){
    try{
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/calendar_kv?key=eq.${encodeURIComponent(key)}&select=value`,
        { headers: SB_HEADERS }
      );
      if (!res.ok) return null;
      const rows = await res.json();
      return rows.length ? rows[0].value : null;
    }catch(e){ return null; }
  }
  async function safeSet(key, value){
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/calendar_kv`, {
        method: 'POST',
        headers: { ...SB_HEADERS, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
        body: JSON.stringify({ key, value })
      });
    }catch(e){ /* session-only fallback */ }
  }

  // Daylight mode: personal display preference, kept in localStorage (not shared/team data)
  const DAYLIGHT_KEY = 'rsmCalendarDaylightMode';
  const daylightToggle = document.getElementById('daylightToggle');
  function applyDaylightMode(on){
    document.body.classList.toggle('daylight', on);
    daylightToggle.textContent = on ? '🌙' : '☀';
    // backdrop-filter can fail to repaint on some mobile browsers when its
    // value changes via a custom property alone — force a reflow on every
    // glass-surface element so the blur actually updates immediately.
    document.querySelectorAll('.notes-drawer, .cycle, .daylight-toggle-btn').forEach(el=>{ void el.offsetHeight; });
  }
  let daylightOn = false;
  try{ daylightOn = localStorage.getItem(DAYLIGHT_KEY) === 'on'; }catch(e){}
  applyDaylightMode(daylightOn);
  daylightToggle.addEventListener('click', ()=>{
    daylightOn = !daylightOn;
    applyDaylightMode(daylightOn);
    try{ localStorage.setItem(DAYLIGHT_KEY, daylightOn ? 'on' : 'off'); }catch(e){ /* ignore */ }
  });

  const today = new Date();
  const todayISO = fmtISO(today);
  const app = document.getElementById('app');

  let isIOS = false, isStandalone = false, isWebContext = false;
  try{
    isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    isWebContext = (location.protocol === 'http:' || location.protocol === 'https:');
  }catch(e){}
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    if (view==='month') render();
  });

  let personNotes = await safeGet('person-notes');
  if (!Array.isArray(personNotes) || personNotes.length !== 3) personNotes = ['', '', ''];
  let selectedPerson = 0;

  // Fully automatic 14-day planning reminder — no storage, no manual reset.
  // Counts 14 down to 1, shows as "due" on day 1, then rolls back to 14 the next day.
  const CYCLE_EPOCH = new Date(2026, 8, 3);
  function daysUntilCheckIn(){
    const daysSince = Math.floor((today - CYCLE_EPOCH) / 86400000);
    const position = ((daysSince % 14) + 14) % 14; // 0..13
    const remaining = 14 - position;               // 14 down to 1
    const due = remaining === 1;
    const nextDate = new Date(today);
    nextDate.setDate(today.getDate() + (remaining - 1));
    return { diff: remaining, due, nextDate };
  }

  // ---- navigation state ----
  let view = 'month';           // 'month' | 'week' | 'day'
  let selectedWeekStart = null; // ISO date of the Sunday for the week being viewed
  let selectedDayISO = null;    // ISO date for the single-day view
  const weekCache = {};         // weekStartISO -> { days:[{task,detail}x7], log:{iso:{done,note}} }

  function blankWeekData(){
    return { days: Array.from({length:7}, ()=>({task:'', detail:''})), log:{} };
  }
  async function loadWeek(weekStartISO){
    if (weekCache[weekStartISO]) return weekCache[weekStartISO];
    let data = await safeGet(`week:${weekStartISO}`);
    if (!data || !Array.isArray(data.days) || data.days.length !== 7) data = blankWeekData();
    if (!data.log) data.log = {};
    weekCache[weekStartISO] = data;
    return data;
  }
  async function saveWeek(weekStartISO){
    await safeSet(`week:${weekStartISO}`, weekCache[weekStartISO]);
  }
  function sundayOf(date){
    const d = new Date(date); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d;
  }
  function weekDatesFrom(sunday){
    return Array.from({length:7}, (_,i)=>{ const d = new Date(sunday); d.setDate(sunday.getDate()+i); return d; });
  }
  function buildMonthWeeks(year, month){
    const firstOfMonth = new Date(year, month, 1);
    const lastOfMonth = new Date(year, month+1, 0);
    const gridStart = sundayOf(firstOfMonth);
    const weeks = [];
    let cursor = new Date(gridStart);
    while (true){
      const dates = weekDatesFrom(cursor);
      weeks.push({ weekStartISO: fmtISO(dates[0]), dates });
      cursor.setDate(cursor.getDate()+7);
      if (cursor > lastOfMonth) break;
    }
    return weeks;
  }

  async function goToWeek(weekStartISO){
    await loadWeek(weekStartISO);
    selectedWeekStart = weekStartISO;
    view = 'week';
    render();
  }
  function goToMonth(){
    view = 'month';
    render();
  }
  async function goToDay(iso){
    const weekStartISO = fmtISO(sundayOf(new Date(iso+'T00:00:00')));
    await loadWeek(weekStartISO);
    selectedDayISO = iso;
    view = 'day';
    render();
  }
  function goToWeekFromDay(){
    selectedWeekStart = fmtISO(sundayOf(new Date(selectedDayISO+'T00:00:00')));
    view = 'week';
    render();
  }

  function wireHeaderActions(){
    const installBtn = document.getElementById('installBtn');
    if (installBtn) installBtn.addEventListener('click', async ()=>{
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      render();
    });
    const shareBtn = document.getElementById('shareBtn');
    if (shareBtn) shareBtn.addEventListener('click', async ()=>{
      const shareData = { title: 'Raw Social Media Calendar', text: 'Our shared content calendar', url: location.href };
      try{
        if (navigator.share){ await navigator.share(shareData); }
        else if (navigator.clipboard){
          await navigator.clipboard.writeText(location.href);
          shareBtn.textContent = 'Link copied';
          setTimeout(()=>{ shareBtn.textContent = 'Share'; }, 1500);
        }
      }catch(e){ /* share cancelled or unsupported, no-op */ }
    });
  }

  function renderMonthView(){
    const {diff, due, nextDate} = daysUntilCheckIn();
    const startYear = today.getFullYear();
    const startMonth = today.getMonth();
    const endYear = startYear + 1;

    const monthList = [];
    for (let y = startYear; y <= endYear; y++){
      const mStart = (y === startYear) ? startMonth : 0;
      for (let m = mStart; m <= 11; m++) monthList.push({ y, m });
    }

    const navHTML = '<button class="nav-today-btn" id="todayNavBtn">Today</button>' + monthList.map(({y,m})=>{
      const showYear = (m === 0) || (y === startYear && m === startMonth);
      const label = MONTH_SHORT[m] + (showYear ? ` '${String(y).slice(2)}` : '');
      return `<a href="#month-${y}-${m}" class="month-nav-link">${label}</a>`;
    }).join('');

    let monthsHTML = '';
    monthList.forEach(({y,m})=>{
      const weeks = buildMonthWeeks(y, m);
      monthsHTML += `
        <div class="month-block" id="month-${y}-${m}">
          <div class="month-title">${MONTHS[m]} ${y}</div>
          <div class="weekday-row">${WEEKDAY_LABELS.map(w=>`<span>${w}</span>`).join('')}</div>
          ${weeks.map(w=>`
            <div class="week-row" data-week="${w.weekStartISO}">
              ${w.dates.map(d=>{
                const out = d.getMonth() !== m;
                const isToday = fmtISO(d) === todayISO;
                const hasIdea = pipelineIdeas.some(p => p.date === fmtISO(d));
                return `<div class="day-cell ${out?'out':''} ${isToday?'today':''}"><span class="day-num">${d.getDate()}</span>${hasIdea?'<span class="idea-dot"></span>':''}</div>`;
              }).join('')}
            </div>
          `).join('')}
        </div>
      `;
    });

    app.innerHTML = `
      <header class="head">
        <h1 class="hero-gradient">Raw Social Media Calendar</h1>
        <div class="actions">
          ${deferredInstallPrompt ? '<button class="action-btn" id="installBtn">Add to Home Screen</button>' : ''}
          ${isWebContext ? '<button class="action-btn" id="shareBtn">Share</button>' : ''}
          ${(!deferredInstallPrompt && isIOS && !isStandalone) ? '<span class="ios-hint">On iPhone: Share icon → Add to Home Screen</span>' : ''}
        </div>
      </header>

      <section class="cycle ${due ? 'due' : ''}">
        <div class="cycle-num ${due ? '' : 'hero-gradient'}">${due ? '✓' : diff}</div>
        <div class="cycle-text">
          <div class="cycle-label">${due ? 'Time to plan the next 2 weeks' : 'days until you plan the next 2 weeks'}</div>
          <div class="cycle-sub">${due ? 'Resets on its own tomorrow \u2014 nothing to press.' : `Next check-in: ${fmtShort(nextDate)}`}</div>
        </div>
      </section>

      <nav class="month-nav">${navHTML}</nav>

      <section class="months">${monthsHTML}</section>
    `;

    wireHeaderActions();
    app.querySelectorAll('.week-row').forEach(row=>{
      row.addEventListener('click', ()=> goToWeek(row.dataset.week));
    });
    document.getElementById('todayNavBtn').addEventListener('click', ()=>{
      goToWeek(fmtISO(sundayOf(today)));
    });
  }

  function renderWeekView(){
    const weekStartISO = selectedWeekStart;
    const sunday = new Date(weekStartISO+'T00:00:00');
    const dates = weekDatesFrom(sunday);
    const data = weekCache[weekStartISO] || blankWeekData();
    const rangeLabel = `${fmtShort(dates[0])} – ${fmtShort(dates[6])}`;

    app.innerHTML = `
      <header class="head">
        <button class="action-btn back-btn" id="backBtn">← All months</button>
        <h1>${rangeLabel}</h1>
      </header>

      <section class="week">
        ${dates.map((d,i)=>{
          const iso = fmtISO(d);
          const isToday = iso === todayISO;
          const log = data.log[iso] || {done:false, note:''};
          const t = data.days[i] || {task:'', detail:''};
          return `
          <div class="row ${isToday?'today':''}">
            <div class="marker"><span class="dot"></span></div>
            <div class="content">
              <div class="row-top row-top-link" data-goto-day="${iso}">
                <span class="day-label">${WEEKDAY_FULL[d.getDay()]}</span>
                <span class="day-date">${fmtShort(d)}</span>
                ${isToday ? '<span class="today-flag">today</span>' : ''}
              </div>
              <input class="task-input" data-field="task" data-idx="${i}" placeholder="What's the plan?" value="${escapeAttr(t.task)}" />
              <input class="detail-input" data-field="detail" data-idx="${i}" placeholder="Add a detail (optional)" value="${escapeAttr(t.detail)}" />
              <div class="row-bottom">
                <label class="done-toggle">
                  <input type="checkbox" data-iso="${iso}" ${log.done ? 'checked':''}/>
                  <span>Done</span>
                </label>
                <input class="note-input" placeholder="Add a note for this date…" data-iso="${iso}" value="${escapeAttr(log.note||'')}" />
              </div>
              ${pipelineIdeas.filter(p=>p.date===iso).map(p=>`
                <div class="idea-flag">🎬 ${escapeAttr(p.text)} <span class="idea-flag-stage">(${p.stage}${p.assignee ? ' · '+escapeAttr(p.assignee) : ''})</span></div>
              `).join('')}
            </div>
          </div>`;
        }).join('')}
      </section>

      <p class="footnote">
        This reminds you when you open it — it can't push a notification on its own.
      </p>
    `;

    document.getElementById('backBtn').addEventListener('click', goToMonth);
    app.querySelectorAll('.row-top-link').forEach(el=>{
      el.addEventListener('click', ()=> goToDay(el.dataset.gotoDay));
    });

    app.querySelectorAll('.task-input, .detail-input').forEach(el=>{
      el.addEventListener('change', async (e)=>{
        const idx = Number(e.target.dataset.idx);
        const field = e.target.dataset.field;
        weekCache[weekStartISO].days[idx] = { ...weekCache[weekStartISO].days[idx], [field]: e.target.value };
        await saveWeek(weekStartISO);
      });
    });
    app.querySelectorAll('input[type=checkbox]').forEach(el=>{
      el.addEventListener('change', async (e)=>{
        const iso = e.target.dataset.iso;
        weekCache[weekStartISO].log[iso] = { ...(weekCache[weekStartISO].log[iso]||{}), done: e.target.checked };
        await saveWeek(weekStartISO);
      });
    });
    app.querySelectorAll('.note-input').forEach(el=>{
      el.addEventListener('change', async (e)=>{
        const iso = e.target.dataset.iso;
        weekCache[weekStartISO].log[iso] = { ...(weekCache[weekStartISO].log[iso]||{}), note: e.target.value };
        await saveWeek(weekStartISO);
      });
    });
  }

  function render(){
    if (view === 'month') renderMonthView();
    else if (view === 'week') renderWeekView();
    else renderDayView();
  }

  function renderDayView(){
    const iso = selectedDayISO;
    const d = new Date(iso+'T00:00:00');
    const weekStartISO = fmtISO(sundayOf(d));
    const data = weekCache[weekStartISO] || blankWeekData();
    const idx = d.getDay();
    const t = data.days[idx] || {task:'', detail:''};
    const log = data.log[iso] || {done:false, note:''};
    const isToday = iso === todayISO;
    const dayIdeas = pipelineIdeas.filter(p => p.date === iso);

    app.innerHTML = `
      <header class="head">
        <button class="action-btn back-btn" id="backToWeekBtn">← Back to week</button>
        <h1>${WEEKDAY_FULL[idx]}</h1>
        <p class="sub">${fmtLong(d)}${isToday ? ' — today' : ''}</p>
      </header>

      <section class="day-detail">
        <input class="task-input" id="dayTaskInput" placeholder="What's the plan?" value="${escapeAttr(t.task)}" />
        <input class="detail-input" id="dayDetailInput" placeholder="Add a detail (optional)" value="${escapeAttr(t.detail)}" />
        <label class="done-toggle">
          <input type="checkbox" id="dayDoneCheckbox" ${log.done ? 'checked':''}/>
          <span>Done</span>
        </label>
        <textarea class="day-note-textarea" id="dayNoteInput" placeholder="Add a note for this date…">${escapeAttr(log.note||'')}</textarea>

        ${dayIdeas.length ? `
          <div class="day-ideas-heading">Scheduled content</div>
          ${dayIdeas.map(p => `<div class="idea-flag">🎬 ${escapeAttr(p.text)} <span class="idea-flag-stage">(${p.stage}${p.assignee?' · '+escapeAttr(p.assignee):''})</span></div>`).join('')}
        ` : ''}
      </section>
    `;

    document.getElementById('backToWeekBtn').addEventListener('click', goToWeekFromDay);
    document.getElementById('dayTaskInput').addEventListener('change', async (e)=>{
      weekCache[weekStartISO].days[idx] = { ...weekCache[weekStartISO].days[idx], task: e.target.value };
      await saveWeek(weekStartISO);
    });
    document.getElementById('dayDetailInput').addEventListener('change', async (e)=>{
      weekCache[weekStartISO].days[idx] = { ...weekCache[weekStartISO].days[idx], detail: e.target.value };
      await saveWeek(weekStartISO);
    });
    document.getElementById('dayDoneCheckbox').addEventListener('change', async (e)=>{
      weekCache[weekStartISO].log[iso] = { ...(weekCache[weekStartISO].log[iso]||{}), done: e.target.checked };
      await saveWeek(weekStartISO);
    });
    document.getElementById('dayNoteInput').addEventListener('change', async (e)=>{
      weekCache[weekStartISO].log[iso] = { ...(weekCache[weekStartISO].log[iso]||{}), note: e.target.value };
      await saveWeek(weekStartISO);
    });
  }

  // ---- personal notes drawer (persists across both views) ----
  const notesHamburger = document.getElementById('notesHamburger');
  const notesDot = document.getElementById('notesDot');
  const notesBackdrop = document.getElementById('notesBackdrop');
  const notesDrawer = document.getElementById('notesDrawer');
  const notesListView = document.getElementById('notesListView');
  const notesPersonView = document.getElementById('notesPersonView');
  const notesPersonTitle = document.getElementById('notesPersonTitle');
  const personNotesArea = document.getElementById('personNotesArea');
  const stageCreateView = document.getElementById('stageCreateView');
  const newIdeaText = document.getElementById('newIdeaText');
  const newIdeaDate = document.getElementById('newIdeaDate');
  const newIdeaAssignee = document.getElementById('newIdeaAssignee');
  const duplicateWarning = document.getElementById('duplicateWarning');
  const addIdeaBtn = document.getElementById('addIdeaBtn');
  const stageListView = document.getElementById('stageListView');
  const stageListTitle = document.getElementById('stageListTitle');
  const stageListItems = document.getElementById('stageListItems');
  const ideasBankView = document.getElementById('ideasBankView');
  const bankInput = document.getElementById('bankInput');
  const bankAddBtn = document.getElementById('bankAddBtn');
  const bankListItems = document.getElementById('bankListItems');
  let notesSaveTimer = null;
  let currentStageFilter = null; // { showStage, setStage } for whichever checklist is open

  function genId(){ return 'id-' + Date.now() + '-' + Math.floor(Math.random()*10000); }

  let pipelineIdeas = await safeGet('pipeline-ideas');
  if (!Array.isArray(pipelineIdeas)) pipelineIdeas = [];
  let ideasBank = await safeGet('ideas-bank');
  if (!Array.isArray(ideasBank)) ideasBank = [];

  function updateNotesDot(){
    notesDot.hidden = !personNotes.some(n => n && n.trim().length > 0);
  }
  updateNotesDot();

  function allSubViews(){ return [notesListView, notesPersonView, stageCreateView, stageListView, ideasBankView]; }
  function showOnly(viewEl){
    allSubViews().forEach(v => { v.hidden = (v !== viewEl); });
  }

  function openNotesDrawer(){
    notesBackdrop.hidden = false;
    notesDrawer.hidden = false;
    showNotesList();
  }
  function closeNotesDrawer(){
    notesBackdrop.hidden = true;
    notesDrawer.hidden = true;
  }
  function showNotesList(){ showOnly(notesListView); }
  function showNotesPerson(idx, label){
    selectedPerson = idx;
    notesPersonTitle.textContent = label;
    personNotesArea.value = personNotes[idx];
    showOnly(notesPersonView);
  }

  const STOPWORDS = new Set(['a','an','the','and','or','of','to','for','on','in','at','with','about','is','are','this','that','our','your','from','into']);
  function significantWords(text){
    return text.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w => w.length > 2 && !STOPWORDS.has(w));
  }
  function findSimilarIdea(text){
    const words = significantWords(text);
    if (words.length === 0) return null;
    const wordSet = new Set(words);
    let best = null, bestDist = Infinity;
    pipelineIdeas.forEach(idea=>{
      const otherWords = significantWords(idea.text);
      if (otherWords.length === 0) return;
      const overlap = otherWords.filter(w => wordSet.has(w)).length;
      const score = overlap / Math.min(wordSet.size, otherWords.length);
      if (score >= 0.5 && idea.date){
        const dist = Math.abs(new Date(idea.date+'T00:00:00') - today);
        if (dist < bestDist){ bestDist = dist; best = idea; }
      }
    });
    return best;
  }

  function showStageCreate(prefillText){
    newIdeaText.value = prefillText || '';
    newIdeaDate.value = '';
    newIdeaAssignee.value = '';
    duplicateWarning.hidden = true;
    showOnly(stageCreateView);
  }

  let editingIdeaId = null;
  let deletingIdeaId = null;

  function ideaRowHTML(i){
    if (i.id === editingIdeaId){
      return `
        <div class="idea-row idea-edit-form" data-id="${i.id}">
          <div class="idea-main">
            <input type="text" class="drawer-input edit-text" value="${escapeAttr(i.text)}">
            <input type="date" class="drawer-input edit-date" value="${i.date || ''}">
            <select class="drawer-input edit-assignee">
              <option value="" ${!i.assignee?'selected':''}>Unassigned</option>
              <option value="Danny" ${i.assignee==='Danny'?'selected':''}>Danny</option>
              <option value="Shauli" ${i.assignee==='Shauli'?'selected':''}>Shauli</option>
              <option value="Sruli" ${i.assignee==='Sruli'?'selected':''}>Sruli</option>
            </select>
            <div class="idea-edit-actions">
              <button type="button" class="action-btn save-edit-btn" data-id="${i.id}">Save</button>
              <button type="button" class="action-btn cancel-edit-btn">Cancel</button>
            </div>
          </div>
        </div>`;
    }
    if (i.id === deletingIdeaId){
      return `
        <div class="idea-row idea-confirm-delete" data-id="${i.id}">
          <div class="idea-main">
            <span class="idea-text">Delete "${escapeAttr(i.text)}"? This can't be undone.</span>
            <div class="idea-edit-actions">
              <button type="button" class="action-btn confirm-delete-btn" data-id="${i.id}">Yes, delete</button>
              <button type="button" class="action-btn cancel-delete-btn">Cancel</button>
            </div>
          </div>
        </div>`;
    }
    return `
      <div class="idea-row" data-id="${i.id}">
        <input type="checkbox" data-id="${i.id}">
        <span class="idea-main">
          <span class="idea-text">${escapeAttr(i.text)}</span>
          <span class="idea-date">${i.date ? fmtShort(new Date(i.date+'T00:00:00')) : ''}</span>
          ${i.assignee ? `<span class="idea-assignee">${escapeAttr(i.assignee)}</span>` : ''}
        </span>
        <span class="idea-row-actions">
          <button type="button" class="idea-icon-btn edit-idea-btn" data-id="${i.id}">✎</button>
          <button type="button" class="idea-icon-btn delete-idea-btn" data-id="${i.id}">×</button>
        </span>
      </div>`;
  }

  function wireIdeaRowEvents(container){
    container.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change', async ()=>{
        const idea = pipelineIdeas.find(i => i.id === cb.dataset.id);
        if (idea) idea.stage = currentStageFilter.setStage;
        await safeSet('pipeline-ideas', pipelineIdeas);
        renderStageChecklist();
      });
    });
    container.querySelectorAll('.edit-idea-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        editingIdeaId = btn.dataset.id;
        deletingIdeaId = null;
        renderStageChecklist();
      });
    });
    container.querySelectorAll('.delete-idea-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        deletingIdeaId = btn.dataset.id;
        editingIdeaId = null;
        renderStageChecklist();
      });
    });
    container.querySelectorAll('.confirm-delete-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        pipelineIdeas = pipelineIdeas.filter(i => i.id !== btn.dataset.id);
        deletingIdeaId = null;
        await safeSet('pipeline-ideas', pipelineIdeas);
        renderStageChecklist();
        render();
      });
    });
    container.querySelectorAll('.cancel-delete-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        deletingIdeaId = null;
        renderStageChecklist();
      });
    });
    container.querySelectorAll('.save-edit-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const row = btn.closest('.idea-edit-form');
        const idea = pipelineIdeas.find(i => i.id === btn.dataset.id);
        if (idea){
          const newText = row.querySelector('.edit-text').value.trim();
          const newDate = row.querySelector('.edit-date').value;
          if (newText) idea.text = newText;
          if (newDate) idea.date = newDate;
          idea.assignee = row.querySelector('.edit-assignee').value;
        }
        editingIdeaId = null;
        await safeSet('pipeline-ideas', pipelineIdeas);
        renderStageChecklist();
        render();
      });
    });
    container.querySelectorAll('.cancel-edit-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        editingIdeaId = null;
        renderStageChecklist();
      });
    });
  }

  function renderStageChecklist(){
    const items = pipelineIdeas.filter(i => i.stage === currentStageFilter.showStage);
    let html;
    if (items.length === 0){
      html = '<p class="empty-hint">Nothing waiting here.</p>';
    } else {
      items.sort((a,b) => (a.date || '').localeCompare(b.date || ''));
      html = items.map(ideaRowHTML).join('');
    }

    if (currentStageFilter.setStage === 'posted'){
      const posted = pipelineIdeas.filter(i => i.stage === 'posted')
        .sort((a,b) => (b.date||'').localeCompare(a.date||''));
      html += '<div class="history-heading">Already posted</div>';
      html += posted.length === 0
        ? '<p class="empty-hint">Nothing posted yet.</p>'
        : posted.map(i => `
            <div class="history-row">
              <span class="idea-date">${i.date ? fmtShort(new Date(i.date+'T00:00:00')) : ''}</span>
              ${escapeAttr(i.text)}${i.assignee ? ` \u2014 ${escapeAttr(i.assignee)}` : ''}
            </div>
          `).join('');
    }

    stageListItems.innerHTML = html;
    wireIdeaRowEvents(stageListItems);
  }
  function showStageList(showStage, setStage, label){
    currentStageFilter = { showStage, setStage };
    editingIdeaId = null;
    deletingIdeaId = null;
    stageListTitle.textContent = label;
    renderStageChecklist();
    showOnly(stageListView);
  }

  function renderBankList(){
    if (ideasBank.length === 0){
      bankListItems.innerHTML = '<p class="empty-hint">No ideas banked yet.</p>';
      return;
    }
    bankListItems.innerHTML = ideasBank.map(b => `
      <div class="bank-row">
        <span class="bank-text">${escapeAttr(b.text)}</span>
        <button class="bank-use-btn" data-id="${b.id}">Use</button>
      </div>
    `).join('');
    bankListItems.querySelectorAll('.bank-use-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const bankItem = ideasBank.find(b => b.id === btn.dataset.id);
        ideasBank = ideasBank.filter(b => b.id !== btn.dataset.id);
        await safeSet('ideas-bank', ideasBank);
        showStageCreate(bankItem ? bankItem.text : '');
      });
    });
  }
  function showIdeasBank(){
    bankInput.value = '';
    renderBankList();
    showOnly(ideasBankView);
  }

  notesHamburger.addEventListener('click', openNotesDrawer);
  notesBackdrop.addEventListener('click', closeNotesDrawer);
  document.querySelectorAll('.drawer-back-btn').forEach(btn=>{
    btn.addEventListener('click', showNotesList);
  });

  document.querySelectorAll('.drawer-person-row').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      showNotesPerson(Number(btn.dataset.idx), btn.textContent);
    });
  });

  document.getElementById('openStageCreate').addEventListener('click', ()=> showStageCreate(''));
  document.getElementById('openStageFilmed').addEventListener('click', ()=> showStageList('idea','filmed','Filmed'));
  document.getElementById('openStageEdited').addEventListener('click', ()=> showStageList('filmed','edited','Edited'));
  document.getElementById('openStagePosted').addEventListener('click', ()=> showStageList('edited','posted','Posted'));
  document.getElementById('openIdeasBank').addEventListener('click', showIdeasBank);

  newIdeaText.addEventListener('input', ()=>{
    duplicateWarning.hidden = true;
    const match = findSimilarIdea(newIdeaText.value);
    if (!match) return;
    const matchDate = new Date(match.date+'T00:00:00');
    const daysDiff = Math.round((matchDate - today) / 86400000); // negative = past, positive = future
    if (Math.abs(daysDiff) > 21) return; // too long ago to bother flagging
    let when;
    if (daysDiff === 0) when = 'today';
    else if (daysDiff === -1) when = 'yesterday';
    else if (daysDiff === 1) when = 'tomorrow';
    else if (daysDiff < 0) when = `${Math.abs(daysDiff)} days ago`;
    else when = `in ${daysDiff} days`;
    duplicateWarning.hidden = false;
    duplicateWarning.textContent = `You've got something similar ${when} (${fmtShort(matchDate)}): "${match.text}" — still want to add this too?`;
  });

  addIdeaBtn.addEventListener('click', async ()=>{
    const text = newIdeaText.value.trim();
    const date = newIdeaDate.value;
    const assignee = newIdeaAssignee.value;
    if (!text || !date) return;
    pipelineIdeas.push({ id: genId(), text, date, stage: 'idea', assignee });
    await safeSet('pipeline-ideas', pipelineIdeas);
    showNotesList();
    render();
  });

  bankAddBtn.addEventListener('click', async ()=>{
    const text = bankInput.value.trim();
    if (!text) return;
    ideasBank.push({ id: genId(), text });
    await safeSet('ideas-bank', ideasBank);
    bankInput.value = '';
    renderBankList();
  });

  personNotesArea.addEventListener('input', (e)=>{
    personNotes[selectedPerson] = e.target.value;
    updateNotesDot();
    clearTimeout(notesSaveTimer);
    notesSaveTimer = setTimeout(async ()=>{
      await safeSet('person-notes', personNotes);
    }, 500);
  });

  render();
})();
</script>
</body>
</html>
